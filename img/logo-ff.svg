<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="ForceFire Extintores">
  <title>ForceFire Logo</title>
  <defs>
    <!-- Cor de vermelho vibrante das setas e chama -->
    <style>
      .ff-red { fill: #D90429; }
      .ff-text { fill: #000000; font-family: 'Times New Roman', Times, Georgia, serif; font-weight: bold; font-size: 26px; }
    </style>
  </defs>

  <!-- ================= SETAS TRIANGULARES (CICLO HORÁRIO) ================= -->
  <g class="ff-red">
    <!-- Seta 1: Lado Esquerdo -> subindo em direção ao topo -->
    <path d="M 35 152 L 90 40 L 102 47 L 47 159 Z"/>
    <polygon points="106,20 74,48 108,54"/>

    <!-- Seta 2: Lado Direito -> descendo em direção ao canto inferior direito -->
    <path d="M 100 35 L 155 147 L 143 154 L 88 42 Z"/>
    <polygon points="172,160 144,128 138,162"/>

    <!-- Seta 3: Lado Inferior -> indo para a esquerda em direção ao canto inferior esquerdo -->
    <path d="M 155 147 L 45 147 L 45 135 L 155 135 Z"/>
    <polygon points="25,141 57,123 57,159"/>
  </g>

  <!-- ================= CHAMA CENTRAL (VERMELHA SÓLIDA) ================= -->
  <path class="ff-red" d="
    M 100 55 
    C 106 70 120 78 120 98 
    C 120 114 109 124 100 124 
    C 91 124 80 114 80 98 
    C 80 87 86 78 93 70 
    C 90 78 94 83 98 84 
    C 95 72 97 63 100 55 Z
    M 100 78
    C 103 86 108 90 108 97
    C 108 104 104 108 100 108
    C 96 108 92 104 92 97
    C 92 92 95 88 98 84
    C 97 87 99 89 100 90
    C 99 85 99 81 100 78 Z
  "/>

  <!-- ================= TEXTO FF (PRETO SÓLIDO) ================= -->
  <text x="100" y="148" text-anchor="middle" class="ff-text" letter-spacing="2">FF</text>
</svg>
