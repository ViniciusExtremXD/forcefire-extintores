<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 120" role="img" aria-label="ForceFire Extintores">
  <title>ForceFire Extintores</title>
  <defs>
    <linearGradient id="ffRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EF233C"/>
      <stop offset="1" stop-color="#D90429"/>
    </linearGradient>
    <!-- Uma seta espessa sobre a aresta A->B do triângulo; as outras duas são
         cópias giradas 120°/240° em torno do centroide (64, 68) => ciclo horário. -->
    <g id="ffArrow">
      <path d="M67 25.2 L94.9 73" stroke="url(#ffRed)" stroke-width="11" stroke-linecap="round" fill="none"/>
      <polygon points="106,92 85.6,81.2 104,68.6" fill="url(#ffRed)"/>
    </g>
  </defs>

  <use href="#ffArrow"/>
  <use href="#ffArrow" transform="rotate(120 64 68)"/>
  <use href="#ffArrow" transform="rotate(240 64 68)"/>

  <!-- Chama central -->
  <path d="M64 36 C68.5 44 76 48.5 76 56 C76 63 70.4 67.5 64 67.5 C57.6 67.5 52 63 52 56 C52 51.4 54.2 48.2 58 44.5 C57.5 47.8 58.8 49.6 61.4 50.3 C59.7 45 61.5 40.5 64 36 Z" fill="#D90429"/>
  <path d="M64 45 C66.4 49.4 69.5 51.6 69.5 55.6 C69.5 59.4 67 61.8 64 61.8 C61 61.8 58.5 59.4 58.5 55.6 C58.5 53 60 51.2 62 49 C61.8 51 62.6 52.1 63.8 52.5 C63 50 63.3 47.6 64 45 Z" fill="#FFFFFF"/>

  <!-- Letras FF serifadas, azul marinho -->
  <text x="64" y="86" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="16" letter-spacing="0.5" fill="#0F172A">FF</text>
</svg>
